<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Journal | Modefx</title>
  <meta name="theme-color" content="#03060F">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icon-32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=Sora:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="journal" class="instrument-page">
  <header class="instrument-bar">
    <a class="back-btn" href="markets.html" aria-label="Back to Markets">&larr;</a>
    <div class="instrument-id"><strong>Journal</strong><span class="fine">Your trade history</span></div>
    <div class="instrument-price"><div id="pg-pnl">—</div><div class="fine">Total realized</div></div>
  </header>

  <main class="full-list">
    <p class="fine" id="pg-gate"></p>
    <div class="table-scroll">
      <table class="admin-table" id="pg-table" hidden>
        <thead><tr><th>When</th><th>Symbol</th><th>Side</th><th>Qty</th><th>Entry</th><th>Exit</th><th>P/L</th><th>Notes</th></tr></thead>
        <tbody id="pg-list"></tbody>
      </table>
    </div>
    <p class="fine" id="pg-empty" hidden>No closed trades yet — this fills in as you close positions.</p>
  </main>

  <script src="market-engine.js" defer></script>
  <script src="config.js"></script>
  <script src="journal.js" defer></script>
</body>
</html>
